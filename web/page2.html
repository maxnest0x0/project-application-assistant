<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница 2</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <div class="page2-container GoR">

        <!-- Кнопка назад -->
        <a href="index.html" class="back-button"><span>Назад</span></a>

        <!-- Верхние блоки -->
        <div class="grid">
            <!-- верхний ряд прямоугольников -->
            <div class="card">
                <input type="text" class="output-input" placeholder="краткое название">
            </div>

            <div class="card">
                <input type="text" class="output-input" placeholder="полное название">
            </div>
            <div class="card">
                <input type="text" class="output-input" placeholder="уровень сложности">
            </div>
        <!-- нижний ряд прямоугольников -->
            <div class="card">
                <input type="text" class="output-input" placeholder="описание">
            </div>
            <div class="card">
                <input type="text" class="output-input" placeholder="цель">
            </div>
            <div class="card">
                <input type="text" class="output-input" placeholder="требуемый результат">
            </div>
        </div>

        <!-- Средние кнопки -->
        <div class="middle">
            <!-- кнопка скачивания ответа нейронки в excel -->
            <div class="big-card excel">Excel</div>
            <!-- json файл для текста -->
            <div class="big-card text">json</div>
        </div>

    </div>

</body>
</html>
