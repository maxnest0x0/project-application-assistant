<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница 2</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="page2-container">
        <!-- Кнопка назад -->
        <a href="/" class="back-button"><span>Назад</span></a>
        <!-- Верхние блоки -->
        <div class="grid">
            <!-- верхний ряд прямоугольников -->
            <div class="card">
                <div class="card-title">Название</div>
                <textarea id="title" class="output-input" readonly></textarea>
            </div>
            <div class="card">
                <div class="card-title">Описание</div>
                <textarea id="description" class="output-input" readonly></textarea>
            </div>
            <div class="card">
                <div class="card-title">Цель</div>
                <textarea id="goal" class="output-input" readonly></textarea>
            </div>
            <!-- нижний ряд прямоугольников -->
            <div class="card">
                <div class="card-title">Результат</div>
                <textarea id="result" class="output-input" readonly></textarea>
            </div>
            <div class="card">
                <div class="card-title">Критерии</div>
                <textarea id="criteria" class="output-input" readonly></textarea>
            </div>
            <div class="card">
                <div class="card-title">Количество участников</div>
                <textarea id="max_participants" class="output-input" readonly></textarea>
            </div>
        </div>
        <!-- Средние кнопки -->
        <div class="middle">
            <!-- кнопка скачивания ответа нейронки в excel -->
            <div id="excel-btn" class="big-card excel">Excel</div>
            <!-- json файл для текста -->
            <div id="json-btn" class="big-card text">JSON</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18/dist/xlsx.mini.min.js"></script>
    <script src="script2.js"></script>
</body>
</html>
